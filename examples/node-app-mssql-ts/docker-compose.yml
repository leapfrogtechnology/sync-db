version: '3.3'

services:
  mssql:
    container_name: 'example-mssql'
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    ports:
      - '1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Secret@123'

  app:
    container_name: 'example-app'
    environment:
      DEBUG: 'sync-db*'
    build: .
