version: '3.3'

services:
  mssql:
    container_name: 'example-mssql'
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    ports:
      - '1433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Secret@123'
    healthcheck:
      # Healthy once the server accepts queries and the databases used by connections.sync-db.json exist.
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -b -Q "IF DB_ID(''db1'') IS NULL CREATE DATABASE db1; IF DB_ID(''db2'') IS NULL CREATE DATABASE db2; IF DB_ID(''db3'') IS NULL CREATE DATABASE db3"',
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  app:
    container_name: 'example-app'
    environment:
      DEBUG: 'sync-db*'
    build: .
    depends_on:
      mssql:
        condition: service_healthy
